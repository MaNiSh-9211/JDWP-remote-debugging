# RBAC configuration for K8s JDWP Debugger
# Minimal permissions required for debugging operations

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-debugger
  namespace: default
  labels:
    app: k8s-debugger

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-debugger-role
  labels:
    app: k8s-debugger
rules:
  # Pod discovery - required to find debuggable pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  
  # Pod logs - optional, useful for debugging
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  
  # Port-forward - required to establish JDWP tunnel
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  
  # Services - optional, for service discovery
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  
  # NO delete, exec, or write permissions - production safety

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-debugger-binding
  labels:
    app: k8s-debugger
subjects:
  - kind: ServiceAccount
    name: k8s-debugger
    namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-debugger-role
  apiGroup: rbac.authorization.k8s.io
