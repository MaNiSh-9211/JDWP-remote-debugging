# Deployment for K8s JDWP Debugger
# This runs the debugger service in the cluster

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-debugger
  namespace: default
  labels:
    app: k8s-debugger
spec:
  replicas: 1  # Single instance - debugging is stateful
  selector:
    matchLabels:
      app: k8s-debugger
  template:
    metadata:
      labels:
        app: k8s-debugger
    spec:
      serviceAccountName: k8s-debugger
      containers:
        - name: debugger
          image: k8s-debugger:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: k8s-debugger
  namespace: default
  labels:
    app: k8s-debugger
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: http
  selector:
    app: k8s-debugger
