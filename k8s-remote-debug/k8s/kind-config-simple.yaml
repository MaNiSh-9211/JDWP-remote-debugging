# Simple Kind cluster configuration
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: debug-cluster
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30807
        hostPort: 8807
        protocol: TCP
      - containerPort: 30005
        hostPort: 5005
        protocol: TCP
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
      - containerPort: 30006
        hostPort: 5006
        protocol: TCP
