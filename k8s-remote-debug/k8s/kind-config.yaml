# Kind cluster configuration for remote JDWP debugging
# This configuration creates a cluster with port mappings for debug services

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: debug-cluster

nodes:
  - role: control-plane
    # Port mappings to access services from host
    extraPortMappings:
      # Valuation Service HTTP
      - containerPort: 30807
        hostPort: 8807
        protocol: TCP
      # Valuation Service JDWP (use 25005 to avoid conflict with local 5005)
      - containerPort: 30005
        hostPort: 25005
        protocol: TCP
      # VCP Service HTTP (use 18081 to avoid conflict with local 8081)
      - containerPort: 30081
        hostPort: 18081
        protocol: TCP
      # VCP Service JDWP (use 25006 to avoid conflict with port-forwards 15006/15007)
      - containerPort: 30006
        hostPort: 25006
        protocol: TCP
    # Mount paths for local development (optional)
    extraMounts:
      - hostPath: /tmp/k8s-debug-logs
        containerPath: /var/log/debug
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "debug-enabled=true"

# Networking configuration
networking:
  # Use default CNI
  disableDefaultCNI: false
  # Pod subnet
  podSubnet: "10.244.0.0/16"
  # Service subnet
  serviceSubnet: "10.96.0.0/16"

# Feature gates
featureGates:
  # Enable topology-aware hints for better service routing
  TopologyAwareHints: true
