# Pre-Production Environment Deployment
# Simulates pre-production environment with debug-enabled services

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vcp-service
  namespace: pre-prod
  labels:
    app: vcp-service
    environment: pre-prod
    debug-enabled: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vcp-service
  template:
    metadata:
      labels:
        app: vcp-service
        environment: pre-prod
        debug-enabled: "true"
    spec:
      containers:
        - name: vcp-service
          image: vcp-service:maven-dep
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
            - name: jdwp
              containerPort: 5005
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
            - name: SPRING_PROFILES_ACTIVE
              value: "pre-prod"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30

---
# ClusterIP Service (internal access only)
apiVersion: v1
kind: Service
metadata:
  name: vcp-service
  namespace: pre-prod
  labels:
    app: vcp-service
    environment: pre-prod
spec:
  type: ClusterIP
  selector:
    app: vcp-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: jdwp
      port: 5005
      targetPort: 5005
      protocol: TCP

---
# Valuation Service for Pre-Prod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valuation-service
  namespace: pre-prod
  labels:
    app: valuation-service
    environment: pre-prod
    debug-enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valuation-service
  template:
    metadata:
      labels:
        app: valuation-service
        environment: pre-prod
        debug-enabled: "true"
    spec:
      containers:
        - name: valuation-service
          image: valuation-debug:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: jdwp
              containerPort: 5005
              protocol: TCP
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
            - name: SPRING_PROFILES_ACTIVE
              value: "pre-prod"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: valuation-service
  namespace: pre-prod
  labels:
    app: valuation-service
    environment: pre-prod
spec:
  type: ClusterIP
  selector:
    app: valuation-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: jdwp
      port: 5005
      targetPort: 5005
      protocol: TCP
