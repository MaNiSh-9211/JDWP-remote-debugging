server.port=8083
# Bind to localhost by default; set JDWP_SERVER_ADDRESS=0.0.0.0 only when
# running inside a container/network AND with JDWP_API_TOKEN configured.
server.address=${JDWP_SERVER_ADDRESS:localhost}
spring.application.name=jdwp-debug-client

# --- Target JVM defaults ---
jdwp.default-target-host=${JDWP_DEFAULT_TARGET_HOST:localhost}
jdwp.default-target-port=${JDWP_DEFAULT_TARGET_PORT:5005}
jdwp.demo-app-base-url=${JDWP_DEMO_APP_BASE_URL:http://localhost:8081}

# --- Security ---
# When JDWP_API_TOKEN is set, every /api request must present the token via
# the X-Debug-Token header (or Authorization: Bearer). Leave empty for local
# development only. ALWAYS set this when binding beyond localhost.
jdwp.api-token=${JDWP_API_TOKEN:}
# Comma-separated list of origins allowed to call the API from a browser.
jdwp.cors-allowed-origins=${JDWP_CORS_ALLOWED_ORIGINS:http://localhost:5177,http://localhost:3000,http://localhost:8083}
# Restrict which JVMs may be attached to (hostnames or IPv4 CIDRs).
# Empty = unrestricted (local dev). Example: localhost,127.0.0.1,10.0.0.0/8
jdwp.allowed-targets=${JDWP_ALLOWED_TARGETS:}
# Auto-disconnect idle JDWP sessions after N minutes (production safety; 0 disables)
jdwp.session-idle-timeout-minutes=${JDWP_SESSION_IDLE_TIMEOUT_MINUTES:30}

# --- Log receiver (agent -> client) ---
jdwp.log-receiver-port=${JDWP_LOG_RECEIVER_PORT:9999}
