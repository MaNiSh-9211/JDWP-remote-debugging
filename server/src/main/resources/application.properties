server.port=8081
spring.application.name=debug-server

demo.data.dir=${DEMO_DATA_DIR:data}

# Enable debug logging
logging.level.com.jdwp.server=DEBUG

# Stream logs to the JDWP client's log receiver (see logback-spring.xml).
# host.docker.internal resolves to the Docker host from inside the container.
log.target.host=${LOG_TARGET_HOST:host.docker.internal}
log.target.port=${LOG_TARGET_PORT:9999}

