name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  java-artifacts:
    name: Java artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package client + log agent
        run: mvn -B -ntp package -DskipTests
        working-directory: client
      - name: Package demo target
        run: mvn -B -ntp package -DskipTests
        working-directory: server
      - name: Package k8s debugger
        run: mvn -B -ntp package -DskipTests
        working-directory: k8s-debug
      - uses: actions/upload-artifact@v4
        with:
          name: java-artifacts
          path: |
            client/target/debug-client-1.0.0.jar
            client/target/console-log-agent.jar
            server/target/debug-server-1.0.0.jar
            k8s-debug/target/k8s-jdwp-debugger-1.0.0.jar

  docker-images:
    name: Docker images → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve lowercase image owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build & push debug-server demo image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/jdwp-debug-server:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/jdwp-debug-server:latest
      - name: Build & push k8s-debugger image
        uses: docker/build-push-action@v6
        with:
          context: k8s-debug
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/k8s-jdwp-debugger:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER_LC }}/k8s-jdwp-debugger:latest

  electron:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            app: windows
            builder_args: --win nsis
          - os: macos-latest
            app: macos
            builder_args: --mac dmg
          - os: ubuntu-latest
            app: linux
            builder_args: --linux AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/jdwp-desktop/app/${{ matrix.app }}/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
        working-directory: client/jdwp-desktop/app/${{ matrix.app }}
      - name: Build renderer + installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx vite build
          npx electron-builder ${{ matrix.builder_args }} --publish never
        working-directory: client/jdwp-desktop/app/${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: jdwp-studio-${{ matrix.app }}
          path: |
            client/jdwp-desktop/app/${{ matrix.app }}/release/*.exe
            client/jdwp-desktop/app/${{ matrix.app }}/release/*.dmg
            client/jdwp-desktop/app/${{ matrix.app }}/release/*.AppImage
          if-no-files-found: error

  publish-release:
    name: Attach artifacts to GitHub Release
    runs-on: ubuntu-latest
    needs: [java-artifacts, electron]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          mkdir -p release-files
          find dist -type f \( -name '*.jar' -o -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec cp {} release-files/ \;
          ls -la release-files
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-files/*
